name: synorra_pos
description: "Synorra Coffee Standalone Local-First POS Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  path_provider: ^2.1.4
  crypto: ^3.0.6
  flutter_classic_bluetooth: ^1.6.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/src/images/logo.png
    - lib/src/images/sn-logo-transparent.png
    - lib/src/images/logo.jpg
    - lib/src/images/computer.jpg
    - lib/src/images/logo_wordmark.png
    - lib/src/images/logo-app.jpg
    - lib/src/images/logo-symbol-transparent.png
    - lib/src/images/logo-wordmark-transparent.png
    - lib/src/images/logo-app-transparent.png
    - lib/src/images/logo-app-square.png
    - lib/src/images/computer-transparent.png
    - lib/src/images/bg-plant.png
    - lib/src/images/logo-wordmark-cropped.png
    - lib/src/images/synorra.jpg

flutter_launcher_icons:
  android: true
  image_path: lib/src/images/logo-app-square.png
  image_path_android: lib/src/images/logo-app-square.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: lib/src/images/logo-app-square.png
  adaptive_icon_foreground_inset: 0
